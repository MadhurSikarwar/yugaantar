# Linux and Windows test runs. NOT RUN YET: this file was written but GitHub has not executed it.
# Tests that need the official toolkit or POSIX permission bits skip themselves where those are absent;
# scripts/check_all.py (validator, scans) is the fuller local check and needs the toolkit as a sibling folder.
name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-demo.txt -r requirements-dev.txt  # demo-only package lets the messaging tests run
      - run: python scripts/verify_dependencies.py
      - run: python -m pytest -rs
      - run: python tools/selfattack.py
      - run: python scripts/e2e_checks.py
